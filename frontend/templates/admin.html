<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Стимул — управление</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/admin.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <div class="admin-topbar">
    <header class="admin-wrap admin-header">
      <a class="brand" href="/">СТИМУЛ</a>
      <div class="admin-actions">
        <a class="site-link" href="/">Открыть сайт ↗</a>
        <form class="logout-form" action="/admin/logout" method="POST">
          <button class="logout-button" type="submit">Выйти</button>
        </form>
      </div>
    </header>
  </div>
  <main class="admin-wrap">
    <section><h1>Преподаватели</h1></section>
    <section class="editor">
      <div class="editor-head"><h2>Новый преподаватель</h2></div>
      <form hx-post="/teachers" hx-encoding="multipart/form-data" hx-target="#teacher-list" hx-swap="innerHTML" hx-on::after-request="if(event.detail.successful) this.reset()">
        <label>Имя преподавателя<input name="name" autocomplete="name" required></label>
        <label>Предмет<input name="subject" required></label>
        <label>Краткая информация<textarea name="bio" required></textarea></label>
        <label>Фотография<input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></label>
        <button class="add-button" type="submit">Добавить преподавателя</button>
      </form>
    </section>
    <section>
      <div class="list-head"><h2>Команда на сайте</h2></div>
      <div id="teacher-list">{{TEACHERS}}</div>
    </section>
  </main>
</body>
</html>
