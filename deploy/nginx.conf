# Поместить в /etc/nginx/sites-available/stimul.
limit_req_zone $binary_remote_addr zone=stimulus_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=stimulus_applications:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name school.example.com;
    client_max_body_size 6m;
    limit_req_status 429;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    location = /admin/login {
        limit_req zone=stimulus_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /applications {
        limit_req zone=stimulus_applications burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /teachers {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8000;
    }
    location /teachers/ {
        client_max_body_size 20m;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
